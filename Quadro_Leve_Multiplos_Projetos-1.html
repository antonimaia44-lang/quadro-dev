<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Quadro Leve — Meus projetos</title><style>
:root{color-scheme:dark;--bg:#080808;--border:#272727;--text:#f7f7f7;--muted:#a8a8a8;--idea:#e9ac44;--organ:#6fa8e8;--impl:#b58be8;--done:#40a978}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.65}.shell{max-width:1240px;margin:22px auto;padding:0 16px}.board{border:1px solid var(--border);border-radius:25px;padding:20px 15px 26px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.head h1{font-size:clamp(24px,5vw,34px);line-height:1.25;margin:0 0 9px}.subtitle{color:var(--muted);font-size:15px}.archive-counter{border:1px solid #444;border-radius:30px;background:none;color:#ccc;padding:9px 13px;white-space:nowrap;display:flex;align-items:center;gap:9px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:15px}.summary-tile{min-width:0;border-radius:15px;color:#17212b;text-align:center;padding:17px 2px 14px;min-height:102px}.summary-tile strong{display:block;font-size:27px;margin-bottom:8px}.summary-tile span{display:block;font-size:clamp(10px,2.5vw,14px);overflow-wrap:anywhere}.new-btn{width:100%;background:#424242;color:#fff;border:0;border-radius:30px;padding:13px;font-size:17px;font-weight:650;margin:0 0 20px}.new-btn:hover{background:#555}.form{border:1px solid #555;border-radius:15px;padding:14px;margin-bottom:20px;display:grid;gap:10px}.form input,.form textarea{width:100%;background:#1c1c1c;color:#fff;border:1px solid #555;border-radius:9px;padding:12px}.form textarea{resize:vertical}.form-actions{display:flex;gap:10px}.form-actions button{flex:1;padding:10px;border-radius:9px;border:1px solid #777;background:#444;color:#fff}.form-actions .save{background:#d6d6d6;color:#111;font-weight:700}.stages{display:grid;grid-template-columns:1fr;gap:16px}.stage{border:1px solid var(--border);border-radius:23px;padding:14px;min-width:0}.stage-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 20px;font-size:23px;font-weight:750;gap:10px}.stage-name{display:flex;align-items:center;gap:11px;min-width:0}.dot{width:13px;height:13px;border-radius:50%;flex:none}.count{color:#a8a8a8;font-size:15px;font-weight:400}.cards{display:grid;gap:12px}.card{background:var(--tone);border-radius:18px;padding:16px 15px 14px;color:#17212b;min-width:0}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.icon-btn{width:55px;height:43px;border-radius:26px;border:1px solid #0002;background:#00000008;color:#564729;display:grid;place-items:center}.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.card h3{font-size:20px;margin:0 0 11px;line-height:1.3;overflow-wrap:anywhere}.card p{font-size:17px;line-height:1.45;margin:0 0 20px;overflow-wrap:anywhere}.move-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.move-actions button{border:0;border-radius:11px;background:#d6d6d6;color:#111;font-weight:650;padding:13px 4px;min-height:48px}.move-actions button:disabled{background:#a4a4a4;color:#5a5a5a}.archive-confirm{margin-top:8px;border:1px solid #555;border-radius:13px;padding:12px;background:#161616}.archive-confirm p{margin:0 0 12px}.archive-confirm .form-actions button:last-child{background:#b84545;border:0}.empty{color:#888;font-size:14px}.archive-list{margin:18px 0 0;border:1px solid #444;border-radius:14px;padding:14px}.archive-list button{background:#d6d6d6;color:#111;border:0;border-radius:8px;padding:7px 10px;margin-left:8px}.archive-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #333;padding:10px 0}.archive-row:first-of-type{border-top:0}.hint{color:#888;font-size:12px;text-align:center;margin-top:18px}@media(min-width:850px){.shell{padding:0 22px}.board{padding:25px}.stages{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stage{padding:12px}.stage-head{font-size:17px;min-height:48px;margin-bottom:12px}.card{padding:12px}.card h3{font-size:16px}.card p{font-size:14px}.card-top{margin-bottom:16px}.move-actions{gap:5px}.move-actions button{font-size:12px;padding:10px 2px}.summary-tile span{font-size:14px}.new-btn{max-width:none}}@media(min-width:1100px){.stage-head{font-size:20px}.card h3{font-size:18px}.card p{font-size:15px}.move-actions button{font-size:14px}}@media(max-width:355px){.board{padding:14px 9px}.summary{gap:4px}.summary-tile{padding:13px 1px}.summary-tile span{font-size:10px}.card h3{font-size:18px}}

.project-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 20px}.project-tools select,.project-tools button,.backup-tools button{background:#242424;color:#fff;border:1px solid #505050;border-radius:10px;padding:11px 12px;min-height:44px}.project-tools select{flex:1;min-width:145px;max-width:100%}.project-tools button{white-space:nowrap}.backup-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.backup-tools button{font-size:13px}.notice{font-size:12px;color:#aaa;margin-top:9px;line-height:1.5}.dialog-overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}.dialog{width:min(100%,440px);background:#191919;border:1px solid #555;border-radius:17px;padding:18px;display:grid;gap:12px}.dialog h2{font-size:19px;margin:0}.dialog input{width:100%;padding:12px;background:#292929;color:#fff;border:1px solid #666;border-radius:9px}.dialog .form-actions button{min-height:44px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#e4e4e4;color:#111;padding:10px 16px;border-radius:10px;z-index:30;box-shadow:0 3px 20px #0008;font-size:14px}.stage .card p{white-space:pre-wrap}.project-title{font-size:15px;color:#a8a8a8}.card-top .icon-btn{flex-shrink:0}.archive-counter{cursor:pointer}
</style></head><body><main class="shell"><section class="board"><header class="head"><div><h1>Quadro de<br>Desenvolvimento</h1><div class="subtitle" id="projectSubtitle">Projeto Roteirista</div></div><button class="archive-counter" id="archiveToggle" aria-label="Ver arquivados" title="Ver arquivados">▣ <span id="archiveCount">0</span></button></header><div class="project-tools"><select id="projectSelect" aria-label="Selecionar projeto"></select><button id="addProject">＋ Projeto</button><button id="renameProject" title="Renomear projeto">Renomear</button></div><div class="summary" id="summary"></div><button class="new-btn" id="newToggle" aria-expanded="false">＋ Nova ideia</button><form class="form" id="newForm" hidden><strong>Criar nova ideia</strong><input id="title" placeholder="Título da ideia" required maxlength="120"><textarea id="description" rows="2" placeholder="Descrição (opcional)"></textarea><div class="form-actions"><button type="button" id="cancel">Cancelar</button><button class="save" type="submit">Adicionar</button></div></form><div class="stages" id="stages"></div><div class="archive-list" id="archiveList" hidden></div><div class="backup-tools"><button id="exportBackup">↓ Exportar backup</button><button id="importBackup">↑ Importar backup</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><div class="notice">Os projetos são independentes. Os dados ficam neste navegador; exporte um backup para preservar ou transferir seu quadro. Importar substitui os projetos atuais após confirmação.</div><div class="hint">Quadro Leve · Um quadro, vários projetos</div></section></main><div class="dialog-overlay" id="dialogOverlay" hidden><form class="dialog" id="dialogForm"><h2 id="dialogTitle">Novo projeto</h2><input id="dialogInput" placeholder="Nome do projeto" maxlength="70" required><div class="form-actions"><button type="button" id="dialogCancel">Cancelar</button><button class="save" type="submit">Salvar</button></div></form></div><div class="toast" id="toast" hidden></div><script>
(()=>{'use strict';
const steps=[{name:'Ideia',color:'#e9ac44'},{name:'Organização',color:'#6fa8e8'},{name:'Implantação',color:'#b58be8'},{name:'Concluído',color:'#40a978'}];
const KEY='quadro-leve-multiplos-projetos-v1',OLD='quadro-leve-roteirista-v1';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({cards:[],archived:[],nextId:1});
let db=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!Array.isArray(db.projects)||!db.projects.length){
 let old=null;try{old=JSON.parse(localStorage.getItem(OLD))}catch(e){}
 const first=fresh();if(old&&Array.isArray(old.cards)&&Array.isArray(old.archived)){first.cards=old.cards;first.archived=old.archived;first.nextId=Math.max(0,...[...first.cards,...first.archived].map(c=>Number(c.id)||0))+1}
 db={version:1,active:'roteirista',projects:[{id:'roteirista',name:'Roteirista',...first}]};
}
let confirmId=null, dialogMode=null, timer=null;
const active=()=>db.projects.find(p=>p.id===db.active)||db.projects[0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify('Não foi possível salvar. Exporte um backup.');return false}};
function notify(message){const t=$('toast');t.textContent=message;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,2800)}
const icon=type=>type==='archive'?'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M10 12h4"/></svg>':'<svg viewBox="0 0 24 24"><rect x="8" y="3" width="12" height="13" rx="2"/><rect x="4" y="8" width="12" height="13" rx="2"/></svg>';
function render(){const p=active();db.active=p.id;$('projectSubtitle').textContent='Projeto '+p.name;$('projectSelect').innerHTML=db.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('');$('archiveCount').textContent=p.archived.length;
$('summary').innerHTML=steps.map((s,i)=>`<div class="summary-tile" style="background:${s.color}"><strong>${p.cards.filter(c=>c.stage===i).length}</strong><span>${s.name}</span></div>`).join('');
$('stages').innerHTML=steps.map((s,i)=>`<section class="stage"><header class="stage-head"><div class="stage-name"><span class="dot" style="background:${s.color}"></span><span>${s.name}</span></div><span class="count">${p.cards.filter(c=>c.stage===i).length}</span></header><div class="cards">${p.cards.filter(c=>c.stage===i).map(c=>`<div class="card-wrap"><article class="card" style="--tone:${s.color}"><div class="card-top"><button class="icon-btn" data-action="archive-ask" data-id="${c.id}" aria-label="Arquivar melhoria ${c.id}">${icon('archive')}</button><button class="icon-btn" data-action="copy" data-id="${c.id}" aria-label="Copiar melhoria ${c.id}">${icon('copy')}</button></div><h3>Nº ${String(c.id).padStart(3,'0')} — ${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="move-actions"><button data-action="move" data-id="${c.id}" data-delta="-1" ${i===0?'disabled':''}>← Voltar</button><button data-action="move" data-id="${c.id}" data-delta="1" ${i===3?'disabled':''}>Avançar →</button></div></article>${confirmId===c.id?`<div class="archive-confirm"><p>Arquivar a melhoria Nº ${String(c.id).padStart(3,'0')}?</p><div class="form-actions"><button data-action="archive-cancel">Cancelar</button><button data-action="archive-confirm" data-id="${c.id}">Confirmar arquivamento</button></div></div>`:''}</div>`).join('')||'<div class="empty">Nenhuma melhoria nesta etapa.</div>'}</div></section>`).join('');
$('archiveList').innerHTML='<strong>Melhorias arquivadas</strong>'+(p.archived.map(c=>`<div class="archive-row"><span>Nº ${String(c.id).padStart(3,'0')} — ${esc(c.title)}</span><button data-action="restore" data-id="${c.id}">Restaurar</button></div>`).join('')||'<p class="empty">Nenhuma melhoria arquivada.</p>');}
function closeNew(){$('newForm').hidden=true;$('newToggle').setAttribute('aria-expanded','false');$('newForm').reset()}
$('newToggle').onclick=()=>{const show=$('newForm').hidden;$('newForm').hidden=!show;$('newToggle').setAttribute('aria-expanded',String(show));if(show)$('title').focus()};$('cancel').onclick=closeNew;
$('newForm').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;const p=active();const id=p.nextId||Math.max(0,...[...p.cards,...p.archived].map(c=>c.id))+1;p.nextId=id+1;p.cards.push({id,title,desc:$('description').value.trim(),stage:0});closeNew();save();render()};
$('archiveToggle').onclick=()=>{$('archiveList').hidden=!$('archiveList').hidden};
$('projectSelect').onchange=e=>{db.active=e.target.value;confirmId=null;closeNew();$('archiveList').hidden=true;save();render()};
function dialog(mode){dialogMode=mode;$('dialogTitle').textContent=mode==='new'?'Novo projeto':'Renomear projeto';$('dialogInput').value=mode==='rename'?active().name:'';$('dialogOverlay').hidden=false;$('dialogInput').focus();$('dialogInput').select()}
$('addProject').onclick=()=>dialog('new');$('renameProject').onclick=()=>dialog('rename');$('dialogCancel').onclick=()=>{$('dialogOverlay').hidden=true};
$('dialogForm').onsubmit=e=>{e.preventDefault();const name=$('dialogInput').value.trim();if(!name)return;if(dialogMode==='new'){const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);db.projects.push({id,name,...fresh()});db.active=id;confirmId=null;closeNew();$('archiveList').hidden=true}else active().name=name;$('dialogOverlay').hidden=true;save();render()};
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const p=active(),action=b.dataset.action,id=Number(b.dataset.id),c=p.cards.find(x=>x.id===id);
if(action==='move'&&c){c.stage=Math.max(0,Math.min(3,c.stage+Number(b.dataset.delta)));confirmId=null;save();render()}
if(action==='archive-ask'){confirmId=confirmId===id?null:id;render()}
if(action==='archive-cancel'){confirmId=null;render()}
if(action==='archive-confirm'&&c){p.cards=p.cards.filter(x=>x.id!==id);p.archived.push(c);confirmId=null;save();render()}
if(action==='restore'){const x=p.archived.find(x=>x.id===id);if(x){p.archived=p.archived.filter(c=>c.id!==id);p.cards.push(x);save();render()}}
if(action==='copy'&&c){const txt=`Nº ${String(c.id).padStart(3,'0')} — ${c.title}\n${c.desc}`;try{await navigator.clipboard.writeText(txt)}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}notify('Cartão copiado')}
});
$('exportBackup').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Quadro_Leve_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBackup').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.projects)||!parsed.projects.length||parsed.projects.some(p=>!p.id||typeof p.name!=='string'||!Array.isArray(p.cards)||!Array.isArray(p.archived)||[...p.cards,...p.archived].some(c=>!Number.isInteger(c.id)||typeof c.title!=='string'||typeof c.desc!=='string'||!Number.isInteger(c.stage)||c.stage<0||c.stage>3)))throw Error('Formato inválido');if(!confirm('Importar este backup? Isso substituirá todos os projetos atuais deste navegador.'))return;db={version:1,active:parsed.projects.some(p=>p.id===parsed.active)?parsed.active:parsed.projects[0].id,projects:parsed.projects.map(p=>({...p,nextId:Math.max(Number(p.nextId)||1,0,...[...p.cards,...p.archived].map(c=>c.id+1))}))};confirmId=null;closeNew();$('archiveList').hidden=true;save();render();notify('Backup importado')}catch(err){alert('Não foi possível importar: arquivo inválido.')}};
save();render();})();
</script></body></html>
