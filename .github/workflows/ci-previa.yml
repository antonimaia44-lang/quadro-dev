name: Previa offline - artefato
on:
  push:
    branches: [ci/previas-offline]
permissions:
  contents: read
concurrency:
  group: previa-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    if: github.repository == 'antonimaia44-lang/quadro-dev' && github.ref == 'refs/heads/ci/previas-offline'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/preview-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
      - name: Validar workflow com actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$archive"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= ../../.github/workflows/ci-previa.yml
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run ci
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: previa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/preview-ci/preview/index.html
            tools/preview-ci/preview/manifest.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
